<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Thumbnail Downloader</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --bg-gradient: linear-gradient(to right, #f9f9f9, #e3f2fd);
      --text-color: #333;
      --input-bg: white;
      --input-border: #ccc;
      --button-bg: #2196f3;
      --button-hover: #1976d2;
      --error-color: red;
      --link-color: #1a73e8;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --container-bg: transparent;
    }

    .dark-mode {
      --bg-color: #121212;
      --bg-gradient: linear-gradient(to right, #121212, #1e1e1e);
      --text-color: #f1f1f1;
      --input-bg: #333;
      --input-border: #555;
      --button-bg: #1976d2;
      --button-hover: #2196f3;
      --error-color: #ff6b6b;
      --link-color: #64b5f6;
      --shadow-color: rgba(0, 0, 0, 0.6);
      --container-bg: #1e1e1e;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: var(--bg-gradient);
      color: var(--text-color);
      transition: background 0.3s ease, color 0.3s ease;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      animation: fadeInDown 0.7s ease-in-out;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      width: 300px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      transition: box-shadow 0.3s ease-in-out;
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    input:focus {
      box-shadow: 0 0 10px var(--button-bg);
      outline: none;
    }

    button {
      background-color: var(--button-bg);
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: var(--button-hover);
      transform: scale(1.03);
    }

    .thumbnail-block {
      margin-top: 30px;
      animation: fadeIn 0.7s ease-in-out;
    }

    .thumb-image {
      max-width: 90%;
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow-color);
      transition: transform 0.3s;
    }

    .thumb-image:hover {
      transform: scale(1.02);
    }

    .thumb-label {
      font-weight: bold;
      margin: 15px 0 5px;
    }

    .download-link {
      color: var(--link-color);
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 30px;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-color);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
    }

    .theme-toggle:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }

    .dark-mode .theme-toggle:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    @keyframes fadeInDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleDarkMode()">🌓</button>
  
  <h1>YouTube Thumbnail Downloader</h1>

  <input type="text" id="youtubeURL" placeholder="Paste YouTube video link here">
  <button onclick="showThumbnails()">Get Thumbnail</button>

  <div id="thumbnailContainer" class="thumbnail-block"></div>

  <script>
    function getYouTubeID(url) {
      const regExp = /(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|watch)\?v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function showThumbnails() {
      const url = document.getElementById("youtubeURL").value;
      const videoId = getYouTubeID(url);
      const container = document.getElementById("thumbnailContainer");

      if (!videoId) {
        container.innerHTML = `<p style="color: var(--error-color);">⚠️ Invalid YouTube URL</p>`;
        return;
      }

      const thumbnails = {
        "HD": `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
        "SD": `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
      };

      let html = "";
      for (const [quality, link] of Object.entries(thumbnails)) {
        html += `
          <div>
            <div class="thumb-label">${quality} Image (${quality === 'HD' ? '1280x720' : '640x480'})</div>
            <img class="thumb-image" src="${link}" alt="${quality} Thumbnail">
            <br>
            <a class="download-link" onclick="downloadImage('${link}', '${videoId}-${quality}.jpg')">
              Download ${quality} Thumbnail Image
            </a>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function downloadImage(url, filename) {
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Image not found");
          return response.blob();
        })
        .then(blob => {
          const blobURL = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = blobURL;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(blobURL); // clean up

          const sizeInKB = (blob.size / 1024).toFixed(1);
          console.log(`Downloaded: ${filename} (${sizeInKB} KB)`);
        })
        .catch(error => {
          alert("Download failed: " + error.message);
        });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDarkMode = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isDarkMode);
      
      // Update the theme toggle icon
      const themeToggle = document.querySelector('.theme-toggle');
      themeToggle.textContent = isDarkMode ? '🌞' : '🌙';
    }

    // Check for saved theme preference
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.querySelector('.theme-toggle').textContent = '🌞';
      } else {
        document.querySelector('.theme-toggle').textContent = '🌙';
      }
    });
  </script>

</body>
</html>
